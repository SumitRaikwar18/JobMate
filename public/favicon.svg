<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="10%" y1="90%" x2="70%" y2="30%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Carbon Squircle Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="#27272A" stroke-width="1.5" />

  <!-- Glowing Origami Ascending Jet / Rocket Arrow -->
  <!-- Left Wing -->
  <path
    d="M15 33L29 32L24 45Z"
    fill="url(#wingGrad)"
    stroke="#38BDF8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Right Wing Fold -->
  <path
    d="M29 32L35 44L41 30Z"
    fill="#3730A3"
    stroke="#38BDF8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Central Fuselage Ascending Arrow Head -->
  <path
    d="M15 33L48 16L41 30L29 32Z"
    fill="url(#bodyGrad)"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow Rocket Tip -->
  <path
    d="M48 16L41 24M48 16L40 18"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Luminous AI Sparkle at Tip -->
  <circle cx="48" cy="16" r="2.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF" />
</svg>
